fit_scoring:
  role_alignment_points: 25
  evidence_strength_points: 25
  seniority_scope_points: 15
  industry_domain_points: 15
  location_remote_travel_points: 10
  application_practicality_points: 10
  high_fit_threshold: 85
  good_fit_threshold: 70
  watchlist_threshold: 55

default_exclusions_or_conflicts:
  ask_before_applying:
    - current employer conflict
    - prior employer sensitivity
    - client or vendor conflict
    - unclear compensation fit
    - relocation requirement
    - heavy travel requirement
    - unverified certification requirement
    - direct hands-on engineering requirement not evidenced
    - sales quota ownership
    - legal attestation
    - references required before interview
    - assessment required
    - EEO, disability, veteran, or demographic questions
  skip_unless_javon_approves:
    - roles below manager level
    - roles requiring unsupported programming ownership
    - roles requiring active security clearance
    - roles requiring relocation away from Miami without remote option
    - roles centered on cold sales or commission-only compensation

submission_policy:
  default: "Prepare and ask for approval before submitting each application."
  high_fit: "Recommend applying, but do not submit until Javon approves the role/application package."
  approved_auto_submit_limitations: "If Javon enables approved auto-submit for a narrow search, still stop for conflicts, legal attestations, salary disclosures, EEO/disability/veteran questions, references, assessments, or missing required answers."
